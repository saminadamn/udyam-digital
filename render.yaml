# Render Blueprint: New > Blueprint > pick this repo. Creates the API as a Docker web service with a seeded SQLite DB.
# After the first deploy, set CORS_ORIGINS to your Vercel URL (Dashboard > udyam-api > Environment) and redeploy.
services:
  - type: web
    name: udyam-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: demo
      - key: OTP_MODE
        value: mock              # demo: the OTP is shown on screen; set to sms with a real SMS provider for production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: PII_HASH_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false              # e.g. https://udyam.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://udyam[a-z0-9-]*\.vercel\.app
      - key: PUBLIC_APP_URL
        sync: false              # the Vercel URL, used in WhatsApp links
      - key: SLA_SCAN_INTERVAL_SEC
        value: "30"
      - key: LLM_PROVIDER
        value: template
      - key: NOTIFY_PROVIDER
        value: mock
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: VOICE_PROVIDER
        value: browser           # sarvam to use your Sarvam key below
      - key: VOICE_API_KEY
        sync: false
